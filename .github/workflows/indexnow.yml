name: IndexNow

# Vercel reports each deployment back to GitHub; once a production deploy succeeds,
# tell IndexNow search engines (Bing and others) to recrawl the sitemap URLs.
on:
  deployment_status:
  workflow_dispatch:

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/indexnow-submit.js
